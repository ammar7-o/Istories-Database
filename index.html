<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Browse and search the Istories Database project folders and files.">
  <title>Istories Database — File Manager</title>
  <link rel="stylesheet" href="core/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.1l1.7 2h8.2A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Z"/>
            <path d="M8.5 12.5h7M8.5 15.5h4.5"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Istories <span>Database</span></h1>
          <p id="brand-stats">Loading project…</p>
        </div>
      </div>

      <div class="search-field" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"/>
          <path d="m16 16 4.5 4.5"/>
        </svg>
        <input id="search" type="search" placeholder="Search all files and folders…" autocomplete="off" spellcheck="false" aria-label="Search all files and folders">
        <button id="clear-search" class="clear-search hidden" type="button" aria-label="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="m7 7 10 10M17 7 7 17"/>
          </svg>
        </button>
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
      </div>
    </header>

    <main class="workspace">
      <section class="panel browser" aria-label="Project file browser">
        <div class="browser-top">
          <div class="nav-group">
            <button id="back" class="icon-btn back-btn" type="button" title="Back" aria-label="Back" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5M11 18l-6-6 6-6"/>
              </svg>
            </button>
            <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
          </div>
          <span id="item-count" class="item-count">…</span>
        </div>

        <div class="browser-titlebar">
          <div id="title-icon" class="title-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.1l1.7 2h8.2A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Z"/>
            </svg>
          </div>
          <div class="title-copy">
            <h2 id="folder-title">Istories Database</h2>
            <p id="folder-subtitle">Loading…</p>
          </div>
        </div>

        <div id="listing" class="listing" role="list" aria-label="Folder contents"></div>

        <div class="browser-foot">
          <span id="manifest-meta">Loading manifest…</span>
          <span class="refresh-hint">Run <code>./tree.sh</code> after adding files</span>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="core/files.js"></script>
  <script src="core/app.js"></script>
</body>
</html>
